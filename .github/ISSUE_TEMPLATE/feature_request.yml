name: Suggest a change
description: Propose new content, copy or behaviour for the landing page
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen
      description: Describe the change as an end result, not a solution.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why
      description: What problem does this solve for a visitor?
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: Mockup or example
      description: Optional, but helpful for anything visual.
